<script type="module">
  const log = (...a) => console.log('[mermaid-init]', ...a);

  (async () => {
    try {
      log('loading mermaid from jsDelivr');
      const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
      log('mermaid loaded', mermaid.version || '(no version property)');
      mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

      const convert = () => {
        // Find every code element kramdown tagged with language-mermaid,
        // regardless of whether it is wrapped in <div class="language-mermaid">
        // (rouge output) or sits directly inside <pre> (plain output).
        const codes = document.querySelectorAll('code.language-mermaid');
        log('candidate code blocks:', codes.length);

        codes.forEach((code, i) => {
          const text = code.textContent;
          const target = code.closest('pre') || code.closest('div.language-mermaid') || code.parentElement;
          if (!target || !text || !text.trim()) {
            log('skipping block', i, 'no target or empty text');
            return;
          }
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = text;
          target.replaceWith(div);
          log('converted block', i, 'replaced', target.tagName);
        });

        const remaining = document.querySelectorAll('div.mermaid');
        log('mermaid divs after conversion:', remaining.length);
        if (remaining.length === 0) {
          log('nothing to render; dumping page state for diagnosis');
          document.querySelectorAll('pre, code, [class*="language-"]').forEach(el => {
            if ((el.className || '').includes('mermaid') || el.textContent.includes('flowchart')) {
              log('  suspicious element:', el.tagName, el.className);
            }
          });
          return;
        }
        mermaid.run({ querySelector: 'div.mermaid' });
        log('mermaid.run() called');
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', convert);
      } else {
        convert();
      }
    } catch (e) {
      log('failed:', e && e.message ? e.message : e);
    }
  })();
</script>
