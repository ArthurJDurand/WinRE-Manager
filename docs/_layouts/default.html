<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title | default: 'WinRE Manager' }}{% endif %}</title>
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <style>
    body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: #24292e; }
    a { color: #0366d6; }
    pre { background: #f6f8fa; padding: 1rem; overflow-x: auto; border-radius: 6px; }
    code { background: #f6f8fa; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 90%; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; margin: 1rem 0; }
    th, td { border: 1px solid #d1d5da; padding: 0.4rem 0.8rem; text-align: left; }
    th { background: #f6f8fa; }
    h1, h2, h3 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3rem; }
    .mermaid { text-align: center; margin: 1.5rem 0; }
  </style>
</head>
<body>
  {{ content }}
  {% include head-custom.html %}
</body>
</html>
